[package]
name = "solar_math"
version = "0.1.0"
edition = "2021"
publish = false
description = "Slot math core for Solar Gleam."

[lib]
name = "solar_math"
# staticlib: linked into the iOS Runner. cdylib: host library for Dart tests.
# rlib: Rust unit tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
incremental = false
